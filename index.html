<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musical Scale & Interval Relationship Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4">
<div class="max-w-3xl mx-auto">
  <h1 class="text-3xl font-bold text-center text-pink-400 mb-1">🎵 Scale & Interval Builder</h1>
  <p class="text-center text-gray-400 text-sm mb-4">Explore scales, intervals, and the circle of fifths</p>

  <div class="grid grid-cols-2 gap-4 mb-4">
    <div>
      <label class="block text-sm text-gray-300 mb-1">Root Note</label>
      <select id="rootNote" class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2" onchange="updateScale()">
        <option value="C">C</option><option value="C#">C# / D♭</option><option value="D">D</option>
        <option value="D#">D# / E♭</option><option value="E">E</option><option value="F">F</option>
        <option value="F#">F# / G♭</option><option value="G">G</option><option value="G#">G# / A♭</option>
        <option value="A">A</option><option value="A#">A# / B♭</option><option value="B">B</option>
      </select>
    </div>
    <div>
      <label class="block text-sm text-gray-300 mb-1">Mode</label>
      <select id="mode" class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2" onchange="updateScale()">
        <option value="Major">Major (Ionian)</option>
        <option value="Minor">Natural Minor (Aeolian)</option>
        <option value="Dorian">Dorian</option>
        <option value="Phrygian">Phrygian</option>
        <option value="Lydian">Lydian</option>
        <option value="Mixolydian">Mixolydian</option>
        <option value="Locrian">Locrian</option>
      </select>
    </div>
  </div>

  <!-- Scale notes display -->
  <div class="bg-gray-900 rounded-xl p-4 mb-4">
    <div class="flex justify-between items-center mb-2">
      <h2 class="text-sm font-semibold text-pink-300 uppercase tracking-wider">Scale Notes</h2>
      <button onclick="playScale()" id="playBtn" class="bg-pink-700 hover:bg-pink-600 px-4 py-1 rounded-lg text-sm font-bold transition-all">▶ Play Scale</button>
    </div>
    <div id="scaleNotes" class="flex flex-wrap gap-2 mb-3"></div>
    <div id="intervalNames" class="text-xs text-gray-400"></div>
  </div>

  <!-- Piano keyboard -->
  <div class="bg-gray-900 rounded-xl p-4 mb-4">
    <h2 class="text-sm font-semibold text-pink-300 uppercase tracking-wider mb-3">Piano (2 Octaves)</h2>
    <div id="piano" class="overflow-x-auto">
      <div id="pianoKeys" class="relative" style="height:120px;width:fit-content;min-width:100%"></div>
    </div>
  </div>

  <!-- Circle of Fifths -->
  <div class="bg-gray-900 rounded-xl p-4">
    <h2 class="text-sm font-semibold text-pink-300 uppercase tracking-wider mb-3">Circle of Fifths</h2>
    <div class="flex justify-center">
      <canvas id="circleCanvas" width="280" height="280" aria-label="Circle of fifths diagram"></canvas>
    </div>
  </div>
</div>

<script>
const CHROMATIC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const MODES = {
  Major:       [2,2,1,2,2,2,1],
  Minor:       [2,1,2,2,1,2,2],
  Dorian:      [2,1,2,2,2,1,2],
  Phrygian:    [1,2,2,2,1,2,2],
  Lydian:      [2,2,2,1,2,2,1],
  Mixolydian:  [2,2,1,2,2,1,2],
  Locrian:     [1,2,2,1,2,2,2],
};
const INTERVAL_NAMES = ['Root','m2','M2','m3','M3','P4','Tritone','P5','m6','M6','m7','M7','Octave'];
const MODE_INTERVAL_LABELS = {
  Major:      ['Root','M2','M3','P4','P5','M6','M7'],
  Minor:      ['Root','M2','m3','P4','P5','m6','m7'],
  Dorian:     ['Root','M2','m3','P4','P5','M6','m7'],
  Phrygian:   ['Root','m2','m3','P4','P5','m6','m7'],
  Lydian:     ['Root','M2','M3','A4','P5','M6','M7'],
  Mixolydian: ['Root','M2','M3','P4','P5','M6','m7'],
  Locrian:    ['Root','m2','m3','P4','d5','m6','m7'],
};

const CIRCLE_OF_FIFTHS = ['C','G','D','A','E','B','F#','C#','G#','D#','A#','F'];

let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function noteFreq(noteIdx, octave = 4) {
  // A4 = 440 Hz, noteIdx 0=C, 9=A
  const semisFromA4 = (noteIdx - 9) + (octave - 4) * 12;
  return 440 * Math.pow(2, semisFromA4 / 12);
}

function playTone(freq, startTime, duration = 0.4) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.5, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.1);
}

function getScaleNotes() {
  const root = document.getElementById('rootNote').value;
  const mode = document.getElementById('mode').value;
  const intervals = MODES[mode];
  const rootIdx = CHROMATIC.indexOf(root);
  const notes = [root];
  let idx = rootIdx;
  for (const step of intervals.slice(0, -1)) {
    idx = (idx + step) % 12;
    notes.push(CHROMATIC[idx]);
  }
  return notes;
}

function updateScale() {
  const notes = getScaleNotes();
  const mode = document.getElementById('mode').value;
  const intervalLabels = MODE_INTERVAL_LABELS[mode];

  // Scale notes chips
  document.getElementById('scaleNotes').innerHTML = notes.map((n, i) => `
    <div class="flex flex-col items-center">
      <span class="bg-pink-700 px-3 py-2 rounded-lg font-bold text-lg">${n}</span>
      <span class="text-xs text-gray-400 mt-1">${intervalLabels[i]}</span>
    </div>
  `).join('') + notes.slice(1).map((n, i) => {
    const step = MODES[mode][i];
    return `<div class="flex items-center text-gray-500 text-xs self-start mt-2" style="margin-left:-0.25rem">↔${step === 1 ? 'h' : 'W'}</div>`;
  }).join('');

  // Actually re-render more cleanly
  document.getElementById('scaleNotes').innerHTML = notes.map((n, i) => `
    <div class="flex flex-col items-center gap-1">
      <span class="bg-pink-700 hover:bg-pink-600 px-3 py-2 rounded-lg font-bold text-lg cursor-pointer transition-all" onclick="playNote('${n}')">${n}</span>
      <span class="text-xs text-gray-500">${intervalLabels[i]}</span>
    </div>
  `).join('');

  // Interval description
  const modeIntervals = MODES[mode];
  const steps = modeIntervals.slice(0, notes.length - 1).map(s => s === 1 ? 'H' : 'W');
  document.getElementById('intervalNames').textContent = 'Steps: ' + steps.join(' – ') + '  |  Mode: ' + mode;

  renderPiano(notes);
  drawCircle();
}

function playNote(noteName, octave = 4) {
  const idx = CHROMATIC.indexOf(noteName);
  playTone(noteFreq(idx, octave), getAudioCtx().currentTime);
}

function playScale() {
  const notes = getScaleNotes();
  const ctx = getAudioCtx();
  let time = ctx.currentTime + 0.05;
  notes.forEach((n, i) => {
    const idx = CHROMATIC.indexOf(n);
    playTone(noteFreq(idx, 4), time, 0.35);
    time += 0.4;
  });
  // Play octave at end
  const rootIdx = CHROMATIC.indexOf(notes[0]);
  playTone(noteFreq(rootIdx, 5), time, 0.6);
}

function renderPiano(scaleNotes) {
  const container = document.getElementById('pianoKeys');
  const WHITE_KEYS = ['C','D','E','F','G','A','B'];
  const BLACK_POS = { 'C#': 0.6, 'D#': 1.6, 'F#': 3.6, 'G#': 4.6, 'A#': 5.6 };
  const WW = 32, BW = 20, WH = 100, BH = 60;

  let html = '';
  let blackHtml = '';

  for (let oct = 4; oct <= 5; oct++) {
    const octOffset = (oct - 4) * WHITE_KEYS.length * WW;
    WHITE_KEYS.forEach((note, i) => {
      const inScale = scaleNotes.includes(note);
      const x = octOffset + i * WW;
      const bg = inScale ? 'bg-pink-300 border-pink-500' : 'bg-white border-gray-300';
      html += `<div class="absolute rounded-b border ${bg} cursor-pointer hover:bg-pink-200 transition-all flex items-end justify-center pb-1"
        style="left:${x}px;top:0;width:${WW-2}px;height:${WH}px"
        onclick="playNoteOct('${note}',${oct})" aria-label="${note}${oct}" title="${note}${oct}">
        <span class="text-gray-600 text-xs font-bold">${note}</span>
      </div>`;
    });

    Object.entries(BLACK_POS).forEach(([note, pos]) => {
      const inScale = scaleNotes.includes(note);
      const x = octOffset + pos * WW + WW/2 - BW/2 + 2;
      const bg = inScale ? 'bg-pink-600' : 'bg-gray-900';
      blackHtml += `<div class="absolute rounded-b cursor-pointer hover:bg-pink-700 transition-all z-10 ${bg}"
        style="left:${x}px;top:0;width:${BW}px;height:${BH}px"
        onclick="playNoteOct('${note}',${oct})" aria-label="${note}${oct}" title="${note}${oct}">
      </div>`;
    });
  }

  container.innerHTML = html + blackHtml;
  container.style.width = (2 * WHITE_KEYS.length * WW) + 'px';
}

function playNoteOct(note, oct) {
  const idx = CHROMATIC.indexOf(note);
  playTone(noteFreq(idx, oct), getAudioCtx().currentTime);
}

function drawCircle() {
  const canvas = document.getElementById('circleCanvas');
  const ctx = canvas.getContext('2d');
  const W = 280, H = 280, cx = 140, cy = 140, R = 110, r = 70;
  const root = document.getElementById('rootNote').value;

  ctx.clearRect(0, 0, W, H);

  // Draw circle background
  ctx.beginPath();
  ctx.arc(cx, cy, R + 25, 0, Math.PI * 2);
  ctx.fillStyle = '#1f2937';
  ctx.fill();
  ctx.strokeStyle = '#374151';
  ctx.lineWidth = 2;
  ctx.stroke();

  CIRCLE_OF_FIFTHS.forEach((note, i) => {
    const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
    const x = cx + R * Math.cos(angle);
    const y = cy + R * Math.sin(angle);
    const isRoot = note === root;
    const scaleNotes = getScaleNotes();
    const inScale = scaleNotes.includes(note);

    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    if (isRoot) { ctx.fillStyle = '#ec4899'; ctx.strokeStyle = '#f9a8d4'; ctx.lineWidth = 2; }
    else if (inScale) { ctx.fillStyle = '#9333ea'; ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 1.5; }
    else { ctx.fillStyle = '#374151'; ctx.strokeStyle = '#4b5563'; ctx.lineWidth = 1; }
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = isRoot || inScale ? '#fff' : '#9ca3af';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(note, x, y);
  });

  // Center label
  ctx.fillStyle = '#f9a8d4';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(root, cx, cy - 10);
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#9ca3af';
  ctx.fillText(document.getElementById('mode').value, cx, cy + 8);
}

updateScale();
</script>
</body>
</html>
